<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa do Nosso Site</title>

    <style>
        body {
            background-color: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background-color: #111827;
            border-radius: 12px;
            overflow: hidden;
            padding-bottom: 30px;
        }

        header {
            background-color: #373280;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .conteudo {
            padding: 30px;
            text-align: center;
        }

        .conteudo h2 {
            margin-bottom: 15px;
        }

        .mapa {
            background-color: #1a2854;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .mapa img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .conteudo {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Este é o mapa do nosso site</h1>
        </header>

        <div class="conteudo">

            <h2>Organização do Projeto</h2>

            <p>
                Confira abaixo o mapa de navegação
                e a estrutura das páginas do nosso site.
            </p>

            <div class="mapa">

                <img
                    src="imagens/mapa.png"
                    alt="Mapa de navegação do nosso site"
                >

            </div>

        </div>

    </div>

</body>
</html>
